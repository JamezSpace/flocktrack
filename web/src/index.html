<head>
  <meta charset="utf-8">
  <title>Web</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="rcfui.svg">
  <style>
    :root {
      --uib-size: 80px;
      --uib-color: light-dark(#111827, #F5F7FA);
      --uib-speed: 3.5s;
      --uib-stroke: 4px;
      --uib-bg-opacity: .1;

      color-scheme: light dark;
    }

    #splash-screen {
      padding-block: 3vh;
      height: 100dvh;
      background-color: light-dark(#F5F7FA, #090B10);
      color: light-dark(#111827, #F5F7FA);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 43.5vh;
    }

    .top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .ldr {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: var(--uib-stroke);
      width: var(--uib-size);
      border-radius: calc(var(--uib-stroke) / 2);
      overflow: hidden;
      transform: translate3d(0, 0, 0);
    }

    .ldr::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background-color: var(--uib-color);
      opacity: var(--uib-bg-opacity);
      transition: background-color 0.3s ease;
    }

    .ldr::after {
      content: '';
      height: 100%;
      width: 100%;
      border-radius: calc(var(--uib-stroke) / 2);
      animation: wobble var(--uib-speed) ease-in-out infinite;
      transform: translateX(-95%);
      background-color: var(--uib-color);
      transition: background-color 0.3s ease;
    }

    @keyframes wobble {

      0%,
      100% {
        transform: translateX(-95%);
      }

      50% {
        transform: translateX(95%);
      }
    }


    #splash-screen-text {
      text-align: center;
      font-size: 12px;

      & p:nth-child(1) {
        color: light-dark(#5E6B7D, #929BAA);
      }

      & p:nth-child(2) {
        color: light-dark(#111827, #F5F7FA);
      }
    }
  </style>
</head>
